name: Playwright demo dotnet tests
on:
  push:
  workflow_dispatch:
  schedule:
    # run at minute 5 past every 4th hour from 2 through 23
    - cron: '5 2/4 * * *'
jobs:
  playwright-demo-dotnet:
    name: Playwright version 1.64.1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./playwright-demo-dotnet
    # stop the job if it runs over 115 minutes
    # to prevent a hanging process from using CI minutes
    timeout-minutes: 115
    steps:
      - name: Delete workflow runs older than one week
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 10
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build
      - name: Playwright install
        run: pwsh ./bin/Debug/net10.0/playwright.ps1 install --with-deps
      # Include the argument "-s <filename>" to use a ".runsettings" file
      - name: Run tests
        run: dotnet test -e BROWSER=chromium --logger trx --logger html --results-directory "TestResults-10.0.x"
      - name: Create report folder
        run: mkdir -m777 ../public
      - name: Copy html report file
        run: cp TestResults-10.0.x/TestResult*.html ../public/index.html
      # results include videos
      - name: Upload playwright results
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-demo-dotnet/TestResults-10.0.x
          if-no-files-found: ignore
      - name: Deploy playwright report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          destination_dir: docs
